<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5dc7a"/>
      <stop offset="100%" stop-color="#a07d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(220,183,58,0.35)"/>
      <stop offset="100%" stop-color="rgba(220,183,58,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <!-- silhouette -->
  <circle cx="300" cy="270" r="120" fill="url(#gold)" opacity="0.85"/>
  <path d="M120 720 C120 520 200 430 300 430 C400 430 480 520 480 720 Z" fill="url(#gold)" opacity="0.85"/>
  <text x="50%" y="92%" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" fill="#eccd4f" opacity="0.7">
    Replace with your portrait
  </text>
</svg>
